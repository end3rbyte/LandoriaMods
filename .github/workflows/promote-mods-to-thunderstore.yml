---
name: Promote mods to Thunderstore

'on':
  workflow_dispatch:
    inputs:
      mods:
        description: Comma-separated mod names to promote
        required: true
        type: string
      confirmation:
        description: Type PROMOTE to confirm the production publication
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: promote-mods-to-thunderstore
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ inputs.confirmation == 'PROMOTE' }}
    runs-on: [self-hosted, Linux, X64, public-mods]
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Check out central Landoria configuration
        shell: bash
        run: |
          set -euo pipefail
          GH_TOKEN="$(sudo cat /var/lib/landoria-secrets/github-token)"
          export GH_TOKEN
          gh repo clone end3rbyte/valheim-root .landoria-root -- --depth 1
          printf '/.landoria-root/\n' >> .git/info/exclude

      - id: gamemodes
        name: Resolve production game modes
        uses: ./.landoria-root/.github/actions/resolve-gamemodes
        with:
          environment: prod

      - id: test-gamemodes
        name: Resolve test game modes
        uses: ./.landoria-root/.github/actions/resolve-gamemodes
        with:
          environment: test

      - id: storage
        name: Resolve the production mod-storage executor
        uses: ./.landoria-root/.github/actions/resolve-inventory
        with:
          host-group: mod_storage
          environment: production
          url-group: website

      - name: Test release and storage automation
        shell: bash
        env:
          LANDORIA_TEST_GAMEMODES_JSON: ${{ steps.test-gamemodes.outputs.configuration }}
          LANDORIA_PROD_GAMEMODES_JSON: ${{ steps.gamemodes.outputs.configuration }}
        run: |
          scripts/ci/test-changelog.sh
          scripts/ci/test-sync-swiss-backup-dlls.sh

      - name: Select mods
        id: mods
        shell: bash
        env:
          REQUESTED_MODS: ${{ inputs.mods }}
        run: |
          set -euo pipefail
          mods="$(tr ',' '\n' <<< "$REQUESTED_MODS" |
              sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
              sed '/^$/d' | sort -u | paste -sd' ' -)"
          [[ -n "$mods" ]] || { echo "At least one mod is required." >&2; exit 1; }
          echo "mods=$mods" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Thunderstore CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/tools
          dotnet tool update tcli --tool-path artifacts/tools --version 0.2.4 ||
              dotnet tool install tcli --tool-path artifacts/tools --version 0.2.4

      - name: Configure release identity
        shell: bash
        run: |
          git config user.name landoria-release-bot
          git config user.email landoria-release-bot@users.noreply.github.com

      - name: Promote changed packages
        shell: bash
        env:
          SELECTED_MODS: ${{ steps.mods.outputs.mods }}
          LANDORIA_GAMEMODES_FILE: ${{ steps.gamemodes.outputs.file }}
          LANDORIA_GAMEMODES_JSON: ${{ steps.gamemodes.outputs.configuration }}
        run: |
          set -euo pipefail
          read -r -a mods <<< "$SELECTED_MODS"
          scripts/ci/promote-mods.sh "${mods[@]}"

      - name: Promote DLLs from test to production storage
        shell: bash
        env:
          LANDORIA_STORAGE_BASE_URL: ${{ steps.storage.outputs.url }}
          LANDORIA_TEST_GAMEMODES_JSON: ${{ steps.test-gamemodes.outputs.configuration }}
          LANDORIA_PROD_GAMEMODES_JSON: ${{ steps.gamemodes.outputs.configuration }}
          STORAGE_HOSTS: ${{ steps.storage.outputs.hosts }}
          SELECTED_MODS: ${{ steps.mods.outputs.mods }}
        run: |
          set -euo pipefail
          storage_host="$(jq -er 'if length == 1 then .[0] else error("exactly one storage executor is required") end' \
              <<< "$STORAGE_HOSTS")"
          read -r -a mods <<< "$SELECTED_MODS"
          scripts/ci/sync-swiss-backup-dlls.sh \
              promote "$storage_host" "${mods[@]}"

      - name: Archive generated packages
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: thunderstore-promotion-packages
          path: artifacts/thunderstore/*.zip
          if-no-files-found: ignore
          retention-days: 14
