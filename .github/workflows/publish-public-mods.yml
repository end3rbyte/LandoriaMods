---
name: Publish public mods

'on':
  push:
    branches: [main]
    paths:
      - Directory.Build.props
      - scripts/ci/**
      - Landoria.*/**
  workflow_dispatch:
    inputs:
      mods:
        description: Comma-separated mod names
        required: true
        type: string
      bump_version:
        description: Increment patch versions before publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-public-mods
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ !contains(github.event.head_commit.message || '',
      'Release-Version-Bump: true') }}
    runs-on: [self-hosted, Linux, X64, public-mods]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out central Landoria configuration
        shell: bash
        run: |
          set -euo pipefail
          GH_TOKEN="$(sudo cat /var/lib/landoria-secrets/github-token)"
          export GH_TOKEN
          gh repo clone end3rbyte/valheim-root .landoria-root -- --depth 1
          printf '/.landoria-root/\n' >> .git/info/exclude

      - id: gamemodes
        name: Resolve test game modes
        uses: ./.landoria-root/.github/actions/resolve-gamemodes
        with:
          environment: test

      - id: prod-gamemodes
        name: Resolve production game modes
        uses: ./.landoria-root/.github/actions/resolve-gamemodes
        with:
          environment: prod

      - id: storage
        name: Resolve the test mod-storage executor
        uses: ./.landoria-root/.github/actions/resolve-inventory
        with:
          host-group: mod_storage
          environment: test
          url-group: website

      - name: Test release and storage automation
        shell: bash
        env:
          LANDORIA_TEST_GAMEMODES_JSON: ${{ steps.gamemodes.outputs.configuration }}
          LANDORIA_PROD_GAMEMODES_JSON: ${{ steps.prod-gamemodes.outputs.configuration }}
        run: |
          scripts/ci/test-changelog.sh
          scripts/ci/test-sync-swiss-backup-dlls.sh

      - name: Select mods
        id: mods
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          REQUESTED_MODS: ${{ inputs.mods }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
              mods="$(tr ',' '\n' <<< "$REQUESTED_MODS" |
                  sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
                  sed '/^$/d' | sort -u | paste -sd' ' -)"
          else
              mods="$(scripts/ci/changed-mods.sh "$BEFORE_SHA" "$AFTER_SHA" |
                  paste -sd' ' -)"
          fi
          [[ -n "$mods" ]] || { echo "No publishable mod changed."; exit 0; }
          echo "mods=$mods" >> "$GITHUB_OUTPUT"

      - name: Configure release commit identity
        if: ${{ steps.mods.outputs.mods != '' }}
        shell: bash
        run: |
          git config user.name landoria-release-bot
          git config user.email landoria-release-bot@users.noreply.github.com

      - name: Build and publish drafts
        if: ${{ steps.mods.outputs.mods != '' }}
        shell: bash
        env:
          BUMP_VERSION: >-
            ${{ github.event_name == 'push' || inputs.bump_version }}
          LANDORIA_GAMEMODES_FILE: ${{ steps.gamemodes.outputs.file }}
          LANDORIA_GAMEMODES_JSON: ${{ steps.gamemodes.outputs.configuration }}
        run: |
          set -euo pipefail
          read -r -a mods <<< "${{ steps.mods.outputs.mods }}"
          if [[ "$BUMP_VERSION" == true ]]; then
              scripts/ci/publish-mods.sh "${mods[@]}"
          else
              scripts/ci/publish-mods.sh --no-version-bump "${mods[@]}"
          fi

      - name: Deploy changed DLLs to test storage
        if: ${{ steps.mods.outputs.mods != '' }}
        shell: bash
        env:
          LANDORIA_STORAGE_BASE_URL: ${{ steps.storage.outputs.url }}
          LANDORIA_TEST_GAMEMODES_JSON: ${{ steps.gamemodes.outputs.configuration }}
          STORAGE_HOSTS: ${{ steps.storage.outputs.hosts }}
          SELECTED_MODS: ${{ steps.mods.outputs.mods }}
        run: |
          set -euo pipefail
          storage_host="$(jq -er 'if length == 1 then .[0] else error("exactly one storage executor is required") end' \
              <<< "$STORAGE_HOSTS")"
          read -r -a mods <<< "$SELECTED_MODS"
          scripts/ci/sync-swiss-backup-dlls.sh \
              deploy-test "$storage_host" "${mods[@]}"

      - name: Reconcile test storage with the modpack
        if: ${{ steps.mods.outputs.mods != '' }}
        shell: bash
        env:
          LANDORIA_STORAGE_BASE_URL: ${{ steps.storage.outputs.url }}
          LANDORIA_TEST_GAMEMODES_JSON: ${{ steps.gamemodes.outputs.configuration }}
          STORAGE_HOSTS: ${{ steps.storage.outputs.hosts }}
        run: |
          set -euo pipefail
          storage_host="$(jq -er 'if length == 1 then .[0] else error("exactly one storage executor is required") end' \
              <<< "$STORAGE_HOSTS")"
          scripts/ci/sync-swiss-backup-dlls.sh reconcile-test "$storage_host"

      - name: Verify the updated modpack against test storage
        if: ${{ steps.mods.outputs.mods != '' }}
        shell: bash
        env:
          LANDORIA_STORAGE_BASE_URL: ${{ steps.storage.outputs.url }}
          LANDORIA_TEST_GAMEMODES_JSON: ${{ steps.gamemodes.outputs.configuration }}
        run: |
          set -euo pipefail
          if [[ -f artifacts/thunderstore/.modpack-published ]]; then
              scripts/ci/verify-test-modpack-storage.sh
          else
              echo "The modpack was not updated; test storage verification is not required."
          fi
