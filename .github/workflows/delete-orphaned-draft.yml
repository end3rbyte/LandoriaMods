---
name: Delete an orphaned private draft

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package name without the Landoria namespace
        required: true
        type: string
      version:
        description: Exact private draft version
        required: true
        type: string
      confirmation:
        description: Type DELETE to permanently delete the private draft
        required: true
        type: string

permissions:
  contents: read

jobs:
  delete:
    if: ${{ inputs.confirmation == 'DELETE' }}
    runs-on: [self-hosted, Linux, X64, public-mods]
    steps:
      - uses: actions/checkout@v5
      - name: Check out central configuration
        shell: bash
        run: |
          GH_TOKEN="$(sudo cat /var/lib/landoria-secrets/github-token)"
          export GH_TOKEN
          gh repo clone end3rbyte/valheim-root .landoria-root -- --depth 1
          printf '/.landoria-root/\n' >> .git/info/exclude
      - id: gamemodes
        uses: ./.landoria-root/.github/actions/resolve-gamemodes
        with:
          environment: test
      - id: repository
        uses: ./.landoria-root/.github/actions/resolve-inventory
        with:
          host-group: mod_repository
          environment: production
          url-group: mod_repository
      - name: Delete orphaned private draft
        env:
          LANDORIA_MODPACK_CONFIGURATION_JSON: ${{ steps.gamemodes.outputs.modpack-configuration }}
          LANDORIA_MOD_REPOSITORY_URL: ${{ steps.repository.outputs.url }}/api/v1/packages
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: scripts/ci/delete-orphaned-draft.sh "$PACKAGE" "$VERSION"
