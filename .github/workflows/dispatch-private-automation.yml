---
name: Dispatch private mod automation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-private-automation.yml
      - .draft-rollbacks/*.json
      - Directory.Build.props
      - Landoria.*/**

permissions:
  contents: read

concurrency:
  group: dispatch-private-mod-automation
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: [self-hosted, Linux, X64, landoria-mods]
    steps:
      - name: Dispatch the private publication workflow
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_AUTOMATION_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            repos/landoria-gaming/LandoriaModsAutomation/dispatches \
            -f event_type=public-mods-push \
            -f "client_payload[before]=$BEFORE_SHA" \
            -f "client_payload[after]=$AFTER_SHA" \
            -f "client_payload[message]=$COMMIT_MESSAGE"
          gh api --method POST \
            repos/landoria-gaming/LandoriaModsAutomation/dispatches \
            -f event_type=public-mods-draft-rollbacks \
            -f "client_payload[before]=$BEFORE_SHA" \
            -f "client_payload[after]=$AFTER_SHA"
