---
name: Reconcile test modpack storage
run-name: Reconcile test storage (${{ inputs.request_id || github.run_id }})

'on':
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID supplied by the dispatching workflow
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: reconcile-test-modpack-storage
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64, public-mods]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Check out central Landoria configuration
        shell: bash
        run: |
          set -euo pipefail
          GH_TOKEN="$(sudo cat /var/lib/landoria-secrets/github-token)"
          export GH_TOKEN
          gh repo clone end3rbyte/valheim-root .landoria-root -- --depth 1
          printf '/.landoria-root/\n' >> .git/info/exclude

      - id: gamemodes
        name: Resolve test game modes
        uses: ./.landoria-root/.github/actions/resolve-gamemodes
        with:
          environment: test

      - id: storage
        name: Resolve test storage
        uses: ./.landoria-root/.github/actions/resolve-inventory
        with:
          host-group: mod_storage
          environment: test
          url-group: website

      - name: Reconcile test storage with the modpack
        shell: bash
        env:
          LANDORIA_STORAGE_BASE_URL: ${{ steps.storage.outputs.url }}
          LANDORIA_TEST_GAMEMODES_JSON: ${{ steps.gamemodes.outputs.configuration }}
          STORAGE_HOSTS: ${{ steps.storage.outputs.hosts }}
        run: |
          set -euo pipefail
          storage_host="$(jq -er 'if length == 1 then .[0] else error("exactly one storage executor is required") end' \
              <<< "$STORAGE_HOSTS")"
          scripts/ci/sync-swiss-backup-dlls.sh reconcile-test "$storage_host"

      - name: Verify test modpack storage
        shell: bash
        env:
          LANDORIA_TEST_GAMEMODES_JSON: ${{ steps.gamemodes.outputs.configuration }}
          STORAGE_HOSTS: ${{ steps.storage.outputs.hosts }}
        run: |
          set -euo pipefail
          storage_host="$(jq -er 'if length == 1 then .[0] else error("exactly one storage executor is required") end' \
              <<< "$STORAGE_HOSTS")"
          storage_snapshot="$(mktemp -d)"
          trap 'find "$storage_snapshot" -depth -delete' EXIT
          scripts/ci/snapshot-swiss-backup-mods.sh \
              test "$storage_host" "$storage_snapshot"
          LANDORIA_STORAGE_ROOT="$storage_snapshot" \
              scripts/ci/verify-test-modpack-storage.sh
